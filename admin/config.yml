# Decap CMS 配置

# 后台品牌与语言
logo_url: /images/avatar.jpg
locale: zh_Hans
display_url: https://MieoM79.github.io
site_url: https://MieoM79.github.io

backend:
  name: github
  repo: MieoM79/MieoM79.github.io
  branch: main
  base_url: https://oauth-proxy-tan.vercel.app
  auth_endpoint: api/oauth
  client_id: Ov23ctdKhR4EYtbiPS9s

# 直接发布（不做草稿/审核流程，保存即上线）
publish_mode: simple

media_folder: source/images
public_folder: /images

collections:
  - name: posts
    label: 文章
    folder: source/_posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 正文, name: body, widget: markdown }
      - { label: 标签(可选), name: tags, widget: list, required: false }